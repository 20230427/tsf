[build-system]
requires      = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tsp-dual-domain"
version = "0.1.0"
description = "Dual-domain (time + frequency) time series forecasting"
readme = "PROJECT_README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    # torch is installed separately (CUDA build matching the GPU) -- see README.
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# xlsx tables for scripts/ablation/update_cumulative_table.py (optional)
tables = ["openpyxl>=3.1"]
# Optuna HPO (scripts/hpo/, src/hpo/) -- see assets/optuna.md
hpo = ["optuna>=4.0"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.poe.tasks]
update = "python scripts/hpo/update_excel_from_optuna.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
