# Solar-Energy — PV production of 137 plants, 10-min (137 channels, 52,560 rows)
# File: solar_AL.txt (LSTNet format: headerless, comma-separated) -- the loader
# handles .txt/.txt.gz automatically.
# Standard split: 0.7 / 0.1 / 0.2. Horizons: pred_len in {96, 192, 336, 720}.
# Hard daily on/off periodicity (night = 0) -> frequency branch is important.

experiment:
  name: solar
  seed: 2024
  checkpoint_dir: checkpoints

data:
  source: csv
  csv_path: data/solar_AL.txt
  target_columns: null
  seq_len: 96
  pred_len: 96
  train_ratio: 0.7
  val_ratio: 0.1
  scale: true

model:
  d_model: 128
  time_kernel_size: 25
  time_dropout: 0.1
  time_encoder: mamba
  mamba_layers: 2
  mamba_d_state: 16
  mamba_d_conv: 4
  mamba_expand: 2
  use_official_mamba: true
  freq_hidden: 128
  freq_dropout: 0.1
  freq_sparsity: 0.0
  freq_encoder: linear
  channel_mixer_layers: 1  # BiMamba across variates (S-Mamba style)
  use_revin: false           # ablation-verified: instance norm HURTS solar
                             # (-0.016 MSE @96). Bounded, zero-at-night data
                             # has no level shift; window mean/std mostly
                             # encode night-fraction and denormalizing
                             # amplifies errors by that unstable std.
  fusion: gated
  head_dropout: 0.1

train:
  device: auto
  epochs: 10
  batch_size: 16
  lr: 0.0005
  weight_decay: 0.0001
  loss: mse
  grad_clip: 5.0
  num_workers: 4
  patience: 3
  amp: true
  lr_scheduler: halve      # lr *= 0.5 each epoch; converges before patience can misfire
  compile: false
