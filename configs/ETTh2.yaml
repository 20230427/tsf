# ETTh2 — Electricity Transformer Temperature, hourly (7 channels, 17,420 rows)
# Noisier and more overfit-prone than ETTh1 -> heavier dropout, smaller stack.
# Standard ETT split: 0.6 / 0.2 / 0.2. Horizons: pred_len in {96,192,336,720}.

experiment:
  name: ETTh2
  seed: 2024
  checkpoint_dir: checkpoints

data:
  source: csv
  csv_path: data/ETTh2.csv
  target_columns: null
  seq_len: 96
  pred_len: 96
  train_ratio: 0.6
  val_ratio: 0.2
  scale: true
  split_protocol: ETTh        # canonical 12/4/4-month borders; tail rows unused

model:
  d_model: 128
  time_kernel_size: 25
  time_dropout: 0.3
  time_encoder: mamba
  mamba_layers: 1            # shallower: ETTh2 rewards simpler models
  mamba_d_state: 16
  mamba_d_conv: 4
  mamba_expand: 2
  use_official_mamba: true
  freq_hidden: 128
  freq_dropout: 0.3
  freq_sparsity: 0.3         # low-pass: high-freq content is mostly noise here
  freq_encoder: linear
  freq_backbone: fits        # FITS-style spectral linear forecast
                             # (linear-in-frequency is near-SOTA on ETTh)
  channel_mixer_layers: 0  # OFF: 7 channels + tiny train set -> the mixer
                           # only adds overfitting capacity on ETT
  fusion: gated
  head_dropout: 0.3

train:
  device: auto
  epochs: 10
  batch_size: 32
  lr: 0.0005                 # linear backbones need a real LR to converge
  weight_decay: 0.0005
  loss: mse
  grad_clip: 5.0
  num_workers: 4
  patience: 10
  min_delta: 0.0
  amp: true
  lr_scheduler: halve      # lr *= 0.5 each epoch (standard ETT recipe)
  compile: false
